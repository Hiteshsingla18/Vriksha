version: '3.8'

services:
  api:
    build: .
    container_name: shadow_audit_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vriksha:vriksha_secret@postgres:5432/vriksha_audit_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vrikshagraph
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: shadow_audit_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://vriksha:vriksha_secret@postgres:5432/vriksha_audit_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.celery_app worker --loglevel=info

  postgres:
    image: postgres:16-alpine
    container_name: shadow_audit_postgres
    environment:
      POSTGRES_USER: vriksha
      POSTGRES_PASSWORD: vriksha_secret
      POSTGRES_DB: vriksha_audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shadow_audit_redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: shadow_audit_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/vrikshagraph
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
